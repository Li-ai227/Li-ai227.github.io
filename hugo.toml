baseURL = 'https://li-ai227.github.io'
languageCode = 'zh-CN'
title = 'InkEcho'
theme = 'PaperMod'

[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  hideSummary = false
  ShowToc = true

  [params.homeInfoParams]
    Title = 'Hi there 👋'
    Content = '欢迎来到我的个人博客'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Li-ai227'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:2024011317@bistu.edu.cn'

